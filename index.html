<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bank Recon App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-16">

  <!-- Header -->
  <div class="bg-indigo-700 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold tracking-tight">Bank Reconcile</h1>
      <p class="text-xs text-indigo-200">High-Speed Large File Engine (DD/MM/YYYY)</p>
    </div>
    <button id="exportBtnTop" onclick="exportToExcel()" class="hidden bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white text-xs font-bold py-2 px-3 rounded-lg shadow transition flex items-center space-x-1">
      <span>📥 Export</span>
    </button>
  </div>

  <div class="max-w-md mx-auto p-4 space-y-4">

    <!-- Upload Box -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">1. Bank Statement (CSV / Excel)</label>
        <input type="file" id="bankFile" accept=".xlsx, .xls, .csv" class="block w-full text-sm text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 border border-slate-200 rounded-xl cursor-pointer" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">2. Software Bank Book (XLS / CSV)</label>
        <input type="file" id="softFile" accept=".xlsx, .xls, .csv" class="block w-full text-sm text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 border border-slate-200 rounded-xl cursor-pointer" />
      </div>

      <button id="reconBtn" onclick="runReconciliation()" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] transition-all text-white font-bold py-3 px-4 rounded-xl shadow-md text-sm uppercase tracking-wide flex justify-center items-center space-x-2">
        <span id="btnText">⚡ Run Reconciliation</span>
      </button>

      <!-- Live Status & Error Alert -->
      <div id="statusMsg" class="hidden text-center text-xs text-indigo-700 font-semibold py-1"></div>
      <div id="errorAlert" class="hidden bg-rose-50 border border-rose-200 text-rose-800 text-xs p-3 rounded-xl space-y-1"></div>
    </div>

    <!-- Summary Metrics -->
    <div id="statsSection" class="hidden space-y-3">
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="bg-emerald-50 border border-emerald-200 p-2.5 rounded-xl">
          <div id="countMatched" class="text-lg font-bold text-emerald-700">0</div>
          <div class="text-[10px] text-emerald-600 font-semibold uppercase">Matched</div>
        </div>
        <div class="bg-amber-50 border border-amber-200 p-2.5 rounded-xl">
          <div id="countConflict" class="text-lg font-bold text-amber-700">0</div>
          <div class="text-[10px] text-amber-600 font-semibold uppercase">Review / Diff</div>
        </div>
        <div class="bg-rose-50 border border-rose-200 p-2.5 rounded-xl">
          <div id="countUnmatched" class="text-lg font-bold text-rose-700">0</div>
          <div class="text-[10px] text-rose-600 font-semibold uppercase">Mismatch</div>
        </div>
      </div>

      <button onclick="exportToExcel()" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-semibold py-2.5 px-4 rounded-xl shadow text-xs uppercase tracking-wider flex justify-center items-center space-x-2">
        <span>📥 Download Full Excel Report</span>
      </button>
    </div>

    <!-- Tabs View -->
    <div id="tabsSection" class="hidden">
      <div class="flex bg-slate-200 p-1 rounded-xl space-x-1 text-xs font-medium">
        <button onclick="switchTab('review')" id="tabReview" class="flex-1 py-1.5 rounded-lg bg-white shadow text-slate-800">Review (<span id="badgeReview">0</span>)</button>
        <button onclick="switchTab('matched')" id="tabMatched" class="flex-1 py-1.5 rounded-lg text-slate-600">Matched (<span id="badgeMatched">0</span>)</button>
        <button onclick="switchTab('unmatched')" id="tabUnmatched" class="flex-1 py-1.5 rounded-lg text-slate-600">Pending</button>
      </div>

      <div id="tabContent" class="mt-3 space-y-2.5"></div>
    </div>

  </div>

  <script>
    let bankEntries = [];
    let softEntries = [];
    let results = { matched: [], review: [], onlyBank: [], onlySoft: [] };

    const STOPWORDS = ["PVT", "LTD", "LIMITED", "ENTERPRISE", "ENTERPRISES", "AGENCY", "AGENCIES", "PHARMA", "MEDICAL", "STORE", "CHEMIST", "AND", "CO", "DISTRIBUTOR", "DISTRIBUTORS", "ASSOCIATES", "INDIA"];

    function formatToDDMMYYYY(val) {
      if (val === undefined || val === null || val === "") return "-";

      let s = String(val).replace(/\0/g, '').trim();
      if (!s || s.toLowerCase() === "nan") return "-";

      // 1. Bank CSV: DD/MM/YYYY or DD-MM-YYYY
      let dmy = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/);
      if (dmy) {
        return `${String(dmy[1]).padStart(2, '0')}/${String(dmy[2]).padStart(2, '0')}/${dmy[3]}`;
      }

      // 2. Software: YYYY-MM-DD
      let ymd = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
      if (ymd) {
        return `${String(ymd[3]).padStart(2, '0')}/${String(ymd[2]).padStart(2, '0')}/${ymd[1]}`;
      }

      // 3. Serial Number
      let num = Number(s);
      if (!isNaN(num) && num > 10000 && num < 80000) {
        let excelEpoch = new Date(Date.UTC(1899, 11, 30));
        let converted = new Date(excelEpoch.getTime() + Math.round(num) * 86400000);
        return `${String(converted.getUTCDate()).padStart(2, '0')}/${String(converted.getUTCMonth() + 1).padStart(2, '0')}/${converted.getUTCFullYear()}`;
      }

      return s;
    }

    function cleanName(str) {
      if (!str) return [];
      let cleaned = String(str).replace(/\0/g, '').toUpperCase().replace(/[^A-Z0-9 ]/g, " ");
      return cleaned.split(/\s+/).filter(w => w.length > 2 && !STOPWORDS.includes(w));
    }

    function checkNameMatch(softTokens, bankNarration) {
      if (!softTokens || softTokens.length === 0) return false;
      const upperNarration = String(bankNarration || "").replace(/\0/g, '').toUpperCase();
      return softTokens.some(token => upperNarration.includes(token));
    }

    function isRoundAmount(amt) {
      if (amt >= 10000) return amt % 1000 === 0;
      if (amt >= 1000) return amt % 500 === 0;
      return amt % 100 === 0;
    }

    // Direct Fast CSV Parser (0% Memory Lag)
    function parseCSVText(text) {
      let lines = text.split(/\r?\n/);
      let matrix = [];
      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (!line) continue;
        // Simple regex to split comma-separated values ignoring quotes
        let row = [];
        let inQuotes = false;
        let token = "";
        for (let j = 0; j < line.length; j++) {
          let char = line[j];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            row.push(token);
            token = "";
          } else {
            token += char;
          }
        }
        row.push(token);
        matrix.push(row);
      }
      return matrix;
    }

    // Universal File Parser (CSV as Text, XLS/XLSX via Binary)
    async function loadAnyFile(file) {
      const isCsv = file.name.toLowerCase().endsWith('.csv');
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        if (isCsv) {
          reader.readAsText(file, 'utf-8');
          reader.onload = (e) => {
            try {
              let matrix = parseCSVText(e.target.result);
              resolve(matrix);
            } catch (err) { reject(err); }
          };
        } else {
          reader.readAsArrayBuffer(file);
          reader.onload = (e) => {
            try {
              let data = new Uint8Array(e.target.result);
              let workbook = XLSX.read(data, { type: 'array', raw: true });
              let firstSheet = workbook.Sheets[workbook.SheetNames[0]];
              let matrix = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: "", raw: true });
              resolve(matrix);
            } catch (err) { reject(err); }
          };
        }
        reader.onerror = reject;
      });
    }

    function extractBankData(matrix) {
      let headerRowIndex = -1;
      let colMap = {};

      for (let i = 0; i < Math.min(35, matrix.length); i++) {
        let rowStr = matrix[i].map(c => String(c).toLowerCase()).join(" ");
        if (rowStr.includes("particular") && (rowStr.includes("amount") || rowStr.includes("balance") || rowStr.includes("debit"))) {
          headerRowIndex = i;
          matrix[i].forEach((colName, cIdx) => {
            let cl = String(colName).toLowerCase().trim();
            if (cl.includes("particular")) colMap.particulars = cIdx;
            if (cl.includes("amount")) colMap.amount = cIdx;
            if (cl.includes("debit/credit") || cl.includes("type")) colMap.type = cIdx;
            if (cl.includes("date") && colMap.date === undefined) colMap.date = cIdx;
            if (cl.includes("cheque")) colMap.chq = cIdx;
          });
          break;
        }
      }

      if (headerRowIndex === -1) throw new Error("Bank file me headers (Particulars, Amount, Date) nahi mile!");

      let list = [];
      for (let i = headerRowIndex + 1; i < matrix.length; i++) {
        let row = matrix[i];
        if (!row || row.length === 0) continue;
        let rawAmt = String(row[colMap.amount] || "").replace(/[\t,\r\n\s"]/g, '').trim();
        let amount = parseFloat(rawAmt);
        let type = String(row[colMap.type] || "").replace(/["\s]/g, '').trim().toUpperCase();
        let name = String(row[colMap.particulars] || "").trim();
        let date = formatToDDMMYYYY(row[colMap.date]);
        let chq = String(row[colMap.chq] || "").replace(/[\t,\0\r\n\s"]/g, '').replace(/\.0$/, '').trim();
        if (chq.toLowerCase() === "nan") chq = "";

        if (!isNaN(amount) && amount > 0 && !name.toUpperCase().includes("OPENING BALANCE")) {
          list.push({
            id: `BNK_${i}`,
            date: date,
            name: name,
            chq: chq,
            amount: Math.round(amount * 100) / 100,
            type: type,
            matched: false
          });
        }
      }
      return list;
    }

    function extractSoftwareData(matrix) {
      let headerRowIndex = -1;
      let colMap = {};

      for (let i = 0; i < Math.min(25, matrix.length); i++) {
        let rowStr = matrix[i].map(c => String(c).toLowerCase()).join(" ");
        if (rowStr.includes("n_amount") || (rowStr.includes("c_opp_name") && rowStr.includes("d_date"))) {
          headerRowIndex = i;
          matrix[i].forEach((colName, cIdx) => {
            let cl = String(colName).toLowerCase().trim();
            if (cl === "n_amount" || cl.includes("amount")) colMap.amount = cIdx;
            if (cl === "c_opp_name" || cl.includes("party") || cl.includes("ledger")) colMap.party = cIdx;
            if (cl === "d_date" || cl.includes("date")) colMap.date = cIdx;
            if (cl === "c_remark") colMap.remark = cIdx;
            if (cl === "c_chq_no") colMap.chq = cIdx;
          });
          break;
        }
      }

      if (headerRowIndex === -1) throw new Error("Software file me headers (n_amount, c_opp_name, d_date) nahi mile!");

      let list = [];
      for (let i = headerRowIndex + 1; i < matrix.length; i++) {
        let row = matrix[i];
        if (!row || row.length === 0) continue;
        let rawAmt = String(row[colMap.amount] || "").replace(/[\t,\0\r\n\s"]/g, '').trim();
        let signedAmount = parseFloat(rawAmt);
        let partyName = String(row[colMap.party] || "").replace(/\0/g, '').trim();
        let date = formatToDDMMYYYY(row[colMap.date]);
        let chq = String(row[colMap.chq] || "").replace(/[\t,\0\r\n\s"]/g, '').trim();

        if (["nan", "NEFT", "RTGS", "UPI", "IMPS", "CHEQUE"].includes(chq.toUpperCase())) chq = "";

        if (!isNaN(signedAmount) && signedAmount !== 0 && !partyName.toLowerCase().includes("opening balance")) {
          list.push({
            id: `SFT_${i}`,
            date: date,
            name: partyName,
            chq: chq,
            tokens: cleanName(partyName),
            amount: Math.round(Math.abs(signedAmount) * 100) / 100,
            type: signedAmount > 0 ? "CR" : "DR",
            matched: false
          });
        }
      }
      return list;
    }

    function organizePendingFast(items) {
      let pairedGroups = [];
      let unpairedCredits = [];
      let unpairedDebits = [];

      let drMap = new Map();
      items.filter(x => x.type === "DR").forEach(dr => {
        let key = Math.round(dr.amount * 100);
        if (!drMap.has(key)) drMap.set(key, []);
        drMap.get(key).push(dr);
      });

      items.filter(x => x.type === "CR").forEach(cr => {
        let key = Math.round(cr.amount * 100);
        let pool = drMap.get(key);
        if (pool && pool.length > 0) {
          let dr = pool.shift();
          pairedGroups.push({ ...cr, isContra: true });
          pairedGroups.push({ ...dr, isContra: true });
        } else {
          unpairedCredits.push({ ...cr, isContra: false });
        }
      });

      drMap.forEach(pool => {
        pool.forEach(dr => unpairedDebits.push({ ...dr, isContra: false }));
      });

      return [...pairedGroups, ...unpairedCredits, ...unpairedDebits];
    }

    async function runReconciliation() {
      const bFile = document.getElementById('bankFile').files[0];
      const sFile = document.getElementById('softFile').files[0];
      const errBox = document.getElementById('errorAlert');
      const statusBox = document.getElementById('statusMsg');
      const btn = document.getElementById('reconBtn');

      errBox.classList.add('hidden');
      errBox.innerHTML = "";

      if (!bFile || !sFile) {
        alert("Dono files (Bank Statement aur Software Book) select karein!");
        return;
      }

      btn.disabled = true;
      statusBox.classList.remove('hidden');
      statusBox.innerText = "Files read ho rahi hain...";

      // Asynchronous non-blocking call
      setTimeout(async () => {
        try {
          const rawBank = await loadAnyFile(bFile);
          statusBox.innerText = "Bank statement loaded! Software file read ho rahi hai...";

          const rawSoft = await loadAnyFile(sFile);
          statusBox.innerText = "Data parsing & indexing...";

          bankEntries = extractBankData(rawBank);
          softEntries = extractSoftwareData(rawSoft);

          statusBox.innerText = `Matching entries (${bankEntries.length} bank, ${softEntries.length} software)...`;

          results = { matched: [], review: [], onlyBank: [], onlySoft: [] };

          // Build Hash Map for Bank: `${cents}_${type}`
          const bankMap = new Map();
          bankEntries.forEach(b => {
            let key = `${Math.round(b.amount * 100)}_${b.type}`;
            if (!bankMap.has(key)) bankMap.set(key, []);
            bankMap.get(key).push(b);
          });

          // Pass 1: Cheque + Amount
          softEntries.forEach(s => {
            if (s.chq && s.chq.length >= 4) {
              let key = `${Math.round(s.amount * 100)}_${s.type}`;
              let pool = bankMap.get(key);
              if (pool) {
                let matchIdx = pool.findIndex(b => !b.matched && (b.chq === s.chq || b.name.includes(s.chq)));
                if (matchIdx !== -1) {
                  let b = pool.splice(matchIdx, 1)[0];
                  s.matched = true;
                  b.matched = true;
                  results.matched.push({ soft: s, bank: b, matchType: "Cheque + Amount" });
                }
              }
            }
          });

          // Pass 2: Name + Amount
          softEntries.filter(s => !s.matched).forEach(s => {
            let key = `${Math.round(s.amount * 100)}_${s.type}`;
            let pool = bankMap.get(key);
            if (pool) {
              let matchIdx = pool.findIndex(b => !b.matched && checkNameMatch(s.tokens, b.name));
              if (matchIdx !== -1) {
                let b = pool.splice(matchIdx, 1)[0];
                s.matched = true;
                b.matched = true;
                results.matched.push({ soft: s, bank: b, matchType: "Name + Amount" });
              }
            }
          });

          // Pass 3: Unique Odd Amount
          softEntries.filter(s => !s.matched).forEach(s => {
            if (!isRoundAmount(s.amount)) {
              let key = `${Math.round(s.amount * 100)}_${s.type}`;
              let pool = bankMap.get(key);
              if (pool && pool.length > 0) {
                let b = pool.shift();
                s.matched = true;
                b.matched = true;
                results.matched.push({ soft: s, bank: b, matchType: "Unique Odd Amount" });
              }
            }
          });

          // Pass 4: Round Amount Conflicts
          softEntries.filter(s => !s.matched).forEach(s => {
            let key = `${Math.round(s.amount * 100)}_${s.type}`;
            let pool = bankMap.get(key);
            if (pool && pool.length > 0) {
              let b = pool.shift();
              results.review.push({
                soft: s,
                bank: b,
                reason: "Round Amount (Name & Cheque Unverified)"
              });
            }
          });

          // Pass 5: Unmatched with Contra Pairing
          let rawOnlySoft = softEntries.filter(s => !s.matched && !results.review.some(r => r.soft.id === s.id));
          let rawOnlyBank = bankEntries.filter(b => !b.matched && !results.review.some(r => r.bank.id === b.id));

          results.onlySoft = organizePendingFast(rawOnlySoft);
          results.onlyBank = organizePendingFast(rawOnlyBank);

          renderUI();
          statusBox.classList.add('hidden');
        } catch (err) {
          errBox.classList.remove('hidden');
          errBox.innerHTML = `<strong>Error:</strong> ${err.message}`;
          statusBox.classList.add('hidden');
          console.error(err);
        } finally {
          btn.disabled = false;
        }
      }, 50);
    }

    function renderUI() {
      document.getElementById('statsSection').classList.remove('hidden');
      document.getElementById('tabsSection').classList.remove('hidden');
      document.getElementById('exportBtnTop').classList.remove('hidden');

      document.getElementById('countMatched').innerText = results.matched.length;
      document.getElementById('countConflict').innerText = results.review.length;
      document.getElementById('countUnmatched').innerText = results.onlySoft.length + results.onlyBank.length;

      document.getElementById('badgeReview').innerText = results.review.length;
      document.getElementById('badgeMatched').innerText = results.matched.length;

      switchTab(results.review.length > 0 ? 'review' : 'matched');
    }

    function switchTab(tab) {
      const container = document.getElementById('tabContent');
      container.innerHTML = "";

      ['Review', 'Matched', 'Unmatched'].forEach(t => {
        let btn = document.getElementById('tab' + t);
        if (t.toLowerCase() === tab) {
          btn.className = "flex-1 py-1.5 rounded-lg bg-white shadow text-slate-900 font-bold";
        } else {
          btn.className = "flex-1 py-1.5 rounded-lg text-slate-500 font-medium";
        }
      });

      if (tab === 'review') {
        if (results.review.length === 0) {
          container.innerHTML = `<div class="p-6 text-center text-xs text-slate-400">All amounts matched perfectly! No round figure conflicts.</div>`;
          return;
        }
        results.review.slice(0, 100).forEach(item => {
          container.innerHTML += `
            <div class="bg-amber-50/70 border border-amber-200 rounded-xl p-3 text-xs space-y-2">
              <div class="flex justify-between items-center font-bold text-amber-900">
                <span>₹${item.soft.amount.toLocaleString('en-IN')} (${item.soft.type})</span>
                <span class="text-[10px] bg-amber-200 text-amber-800 px-2 py-0.5 rounded-full font-semibold">Review Needed</span>
              </div>
              <div class="space-y-1 text-slate-700 bg-white p-2.5 rounded-lg border border-amber-100">
                <div class="flex justify-between">
                  <span class="font-semibold text-slate-400">Software:</span>
                  <span class="text-[11px] text-indigo-700 font-bold">${item.soft.date}</span>
                </div>
                <div class="text-slate-800 font-medium">${item.soft.name}</div>
                <div class="flex justify-between mt-1 pt-1 border-t border-slate-100">
                  <span class="font-semibold text-slate-400">Bank:</span>
                  <span class="text-[11px] text-emerald-700 font-bold">${item.bank.date}</span>
                </div>
                <div class="text-slate-800">${item.bank.name}</div>
              </div>
            </div>
          `;
        });
        if (results.review.length > 100) {
          container.innerHTML += `<div class="text-center text-xs text-slate-400 py-2">Showing first 100 of ${results.review.length} conflicts.</div>`;
        }
      } else if (tab === 'matched') {
        results.matched.slice(0, 50).forEach(item => {
          container.innerHTML += `
            <div class="bg-white border border-emerald-200 rounded-xl p-3 text-xs flex justify-between items-center shadow-sm">
              <div class="pr-2">
                <div class="font-bold text-slate-800">${item.soft.name}</div>
                <div class="text-[10px] text-slate-400 truncate max-w-[200px]">${item.bank.name}</div>
              </div>
              <div class="text-right whitespace-nowrap">
                <div class="font-bold text-emerald-600">₹${item.soft.amount.toLocaleString('en-IN')}</div>
                <div class="text-[10px] text-slate-600 font-medium">S: ${item.soft.date} | B: ${item.bank.date}</div>
                <div class="text-[9px] text-emerald-700 font-semibold">${item.matchType}</div>
              </div>
            </div>
          `;
        });
        if (results.matched.length > 50) {
          container.innerHTML += `<div class="text-center text-xs text-slate-400 py-2">Showing first 50 of ${results.matched.length} matched records (Download Excel for full report).</div>`;
        }
      } else if (tab === 'unmatched') {
        container.innerHTML += `<div class="text-[11px] font-bold text-slate-600 uppercase px-1 flex justify-between">
          <span>Only In Bank (${results.onlyBank.length})</span>
          <span class="text-[10px] text-slate-400">Contra Paired & Cr First</span>
        </div>`;
        
        results.onlyBank.slice(0, 50).forEach(b => {
          let cardBg = b.isContra ? "bg-purple-50/80 border-purple-300 ring-1 ring-purple-200" : "bg-white border-slate-200";
          let typeBadge = b.type === "CR" ? "bg-emerald-100 text-emerald-800" : "bg-rose-100 text-rose-800";
          let contraTag = b.isContra ? `<span class="text-[9px] bg-purple-200 text-purple-900 font-bold px-1.5 py-0.5 rounded ml-1">🔁 Contra Pair</span>` : "";

          container.innerHTML += `
            <div class="${cardBg} border rounded-xl p-2.5 text-xs flex justify-between items-center shadow-sm">
              <div class="truncate max-w-[210px]">
                <div class="flex items-center text-[10px] text-slate-500 font-semibold space-x-1">
                  <span class="text-indigo-700 font-bold">${b.date}</span>
                  <span class="px-1.5 py-0.2 rounded font-bold ${typeBadge}">${b.type}</span>
                  ${contraTag}
                </div>
                <div class="font-medium text-slate-800 truncate mt-0.5">${b.name}</div>
              </div>
              <div class="font-bold text-indigo-700 whitespace-nowrap text-sm">₹${b.amount.toLocaleString('en-IN')}</div>
            </div>
          `;
        });

        container.innerHTML += `<div class="text-[11px] font-bold text-slate-600 uppercase px-1 mt-4 flex justify-between">
          <span>Only In Software (${results.onlySoft.length})</span>
          <span class="text-[10px] text-slate-400">Contra Paired & Cr First</span>
        </div>`;
        
        results.onlySoft.slice(0, 50).forEach(s => {
          let cardBg = s.isContra ? "bg-purple-50/80 border-purple-300 ring-1 ring-purple-200" : "bg-white border-slate-200";
          let typeBadge = s.type === "CR" ? "bg-emerald-100 text-emerald-800" : "bg-rose-100 text-rose-800";
          let contraTag = s.isContra ? `<span class="text-[9px] bg-purple-200 text-purple-900 font-bold px-1.5 py-0.5 rounded ml-1">🔁 Contra Pair</span>` : "";

          container.innerHTML += `
            <div class="${cardBg} border rounded-xl p-2.5 text-xs flex justify-between items-center shadow-sm">
              <div class="truncate max-w-[210px]">
                <div class="flex items-center text-[10px] text-slate-500 font-semibold space-x-1">
                  <span class="text-indigo-700 font-bold">${s.date}</span>
                  <span class="px-1.5 py-0.2 rounded font-bold ${typeBadge}">${s.type}</span>
                  ${contraTag}
                </div>
                <div class="font-medium text-slate-800 truncate mt-0.5">${s.name}</div>
              </div>
              <div class="font-bold text-slate-700 whitespace-nowrap text-sm">₹${s.amount.toLocaleString('en-IN')}</div>
            </div>
          `;
        });
      }
    }

    function exportToExcel() {
      if (results.matched.length === 0 && results.review.length === 0 && results.onlyBank.length === 0 && results.onlySoft.length === 0) {
        alert("Pehle reconciliation run karein!");
        return;
      }

      const wb = XLSX.utils.book_new();

      const reviewData = results.review.map(r => ({
        "Software Date (DD/MM/YYYY)": String(r.soft.date),
        "Bank Date (DD/MM/YYYY)": String(r.bank.date),
        "Amount": r.soft.amount,
        "Type": r.soft.type,
        "Software Party Name": r.soft.name,
        "Bank Narration": r.bank.name,
        "Conflict Reason": r.reason
      }));
      let ws1 = XLSX.utils.json_to_sheet(reviewData.length ? reviewData : [{"Status": "No Conflicts"}]);
      XLSX.utils.book_append_sheet(wb, ws1, "Review_Conflicts");

      const matchedData = results.matched.map(m => ({
        "Software Date (DD/MM/YYYY)": String(m.soft.date),
        "Bank Date (DD/MM/YYYY)": String(m.bank.date),
        "Amount": m.soft.amount,
        "Type": m.soft.type,
        "Software Party Name": m.soft.name,
        "Bank Narration": m.bank.name,
        "Match Method": m.matchType,
        "Status": "RECONCILED"
      }));
      let ws2 = XLSX.utils.json_to_sheet(matchedData.length ? matchedData : [{"Status": "No Matched Records"}]);
      XLSX.utils.book_append_sheet(wb, ws2, "Auto_Matched");

      const bankOnlyData = results.onlyBank.map(b => ({
        "Bank Date (DD/MM/YYYY)": String(b.date),
        "Type (CR/DR)": b.type,
        "Amount": b.amount,
        "Contra Status": b.isContra ? "CONTRA / REVERSAL PAIR" : "SINGLE",
        "Bank Narration": b.name,
        "Action Required": "Post in Software"
      }));
      let ws3 = XLSX.utils.json_to_sheet(bankOnlyData.length ? bankOnlyData : [{"Status": "None"}]);
      XLSX.utils.book_append_sheet(wb, ws3, "Only_In_Bank");

      const softOnlyData = results.onlySoft.map(s => ({
        "Software Date (DD/MM/YYYY)": String(s.date),
        "Type (CR/DR)": s.type,
        "Amount": s.amount,
        "Contra Status": s.isContra ? "CONTRA / REVERSAL PAIR" : "SINGLE",
        "Party Name": s.name,
        "Action Required": "Pending Bank Clearance"
      }));
      let ws4 = XLSX.utils.json_to_sheet(softOnlyData.length ? softOnlyData : [{"Status": "None"}]);
      XLSX.utils.book_append_sheet(wb, ws4, "Only_In_Software");

      const today = new Date();
      const dd = String(today.getDate()).padStart(2, '0');
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const yyyy = today.getFullYear();
      XLSX.writeFile(wb, `Reconciliation_Report_${dd}-${mm}-${yyyy}.xlsx`);
    }
  </script>
</body>
</html>
